{% extends 'layout.html' %}

{% block title %}Edit Expense - Smart Expense Tracker{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-lg">
            <div class="card-header bg-gradient-primary text-white border-0 py-4">
                <div class="d-flex align-items-center">
                    <i class="fas fa-edit fa-2x me-3"></i>
                    <div>
                        <h4 class="mb-0">Edit Expense</h4>
                        <p class="mb-0 opacity-75">Update your expense details</p>
                    </div>
                </div>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                <i class="fas fa-tag me-1"></i>Expense Title
                            </label>
                            <input type="text" name="title" class="form-control form-control-lg"
                                   value="{{ expense.title }}" required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold">
                                <i class="fas fa-rupee-sign me-1"></i>Amount
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" step="0.01" name="amount" class="form-control form-control-lg"
                                       value="{{ expense.amount }}" required>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold">
                                <i class="fas fa-calendar me-1"></i>Date
                            </label>
                            <input type="date" name="date" class="form-control form-control-lg"
                                   value="{{ expense.date.strftime('%Y-%m-%d') }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                <i class="fas fa-list me-1"></i>Category
                            </label>
                            <select name="category" class="form-select form-select-lg" required>
                                <option value="Food" {% if expense.category == 'Food' %}selected{% endif %}>🍽️ Food & Dining</option>
                                <option value="Travel" {% if expense.category == 'Travel' %}selected{% endif %}>✈️ Travel</option>
                                <option value="Shopping" {% if expense.category == 'Shopping' %}selected{% endif %}>🛍️ Shopping</option>
                                <option value="Bills" {% if expense.category == 'Bills' %}selected{% endif %}>💡 Bills & Utilities</option>
                                <option value="Entertainment" {% if expense.category == 'Entertainment' %}selected{% endif %}>🎬 Entertainment</option>
                                <option value="Healthcare" {% if expense.category == 'Healthcare' %}selected{% endif %}>🏥 Healthcare</option>
                                <option value="Education" {% if expense.category == 'Education' %}selected{% endif %}>📚 Education</option>
                                <option value="Other" {% if expense.category == 'Other' %}selected{% endif %}>📦 Other</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                <i class="fas fa-credit-card me-1"></i>Payment Method
                            </label>
                            <select name="payment_method" class="form-select form-select-lg" required>
                                <option value="Cash" {% if expense.payment_method == 'Cash' %}selected{% endif %}>💵 Cash</option>
                                <option value="UPI" {% if expense.payment_method == 'UPI' %}selected{% endif %}>📱 UPI</option>
                                <option value="Card" {% if expense.payment_method == 'Card' %}selected{% endif %}>💳 Card</option>
                                <option value="Net Banking" {% if expense.payment_method == 'Net Banking' %}selected{% endif %}>🏦 Net Banking</option>
                                <option value="Wallet" {% if expense.payment_method == 'Wallet' %}selected{% endif %}>👛 Digital Wallet</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">
                                <i class="fas fa-comment me-1"></i>Description (Optional)
                            </label>
                            <textarea name="description" class="form-control form-control-lg" rows="3"
                                      placeholder="Additional notes...">{{ expense.description or '' }}</textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/dashboard" class="btn btn-outline-secondary btn-lg">
                            <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                        </a>
                        <div>
                            <button type="reset" class="btn btn-outline-warning me-2">
                                <i class="fas fa-undo me-1"></i>Reset
                            </button>
                            <button type="submit" class="btn btn-success btn-lg px-4">
                                <i class="fas fa-save me-2"></i>Update Expense
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
